name: ladder-intraday

on:
  workflow_dispatch:
  schedule:
    # Weekday polls, every 5 minutes UTC. The two ranges do not overlap.
    # KST day session 09:00-15:59 = 00:00-06:59 UTC. 09:00-09:10 is the
    # broker wipe, so those runs log the time guard and exit. Daylight
    # time from 09:10 is order type 63. Standard time stays on US
    # after-hours (62) until 10:00 KST (01:00 UTC), then 63. The existing
    # 16:00-17:10 KST guard is 07:00-08:10 UTC, so this poll stops at 15:59.
    - cron: "*/5 0-6 * * 1-5"
    # US session 17:10-07:59 KST = 08:10-22:59 UTC. 08:00-09:10 KST
    # (23:00-00:10 UTC) is the morning wipe guard and is not polled.
    # Friday 15:00-22:59 UTC is Saturday 00:00-07:59 KST, still Friday
    # in New York, so this range covers that morning too.
    - cron: "*/5 8-22 * * 1-5"
    # Standard time: Friday after-hours runs until 10:00 KST Saturday
    # (20:00 EST). 09:10-09:55 KST is 00:10-00:55 UTC Saturday. 09:00-09:10
    # is the wipe guard. Daylight time has already ended at 09:00 KST,
    # so those runs hit the time guard and exit.
    - cron: "*/5 0 * * 6"
  push:
    paths:
      - .github/workflows/ladder-intraday.yml
      - ladder_bot.py
      - restore_ladder_state.py
  issue_comment:
    types: [created]

concurrency:
  group: ladder-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  ladder-intraday:
    name: ladder-intraday
    # schedule, workflow_dispatch, and push run as they do today. A comment
    # runs only for the owner, on a non-PR issue labeled ladder-kick, when
    # the new comment starts with kick. Any other comment skips this job
    # before checkout, so no secret is read and no broker call is made.
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'ladder-kick') &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, 'kick'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore access token
        uses: actions/cache@v4
        with:
          path: .nhplug-token
          key: nhplug-token-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nhplug-token-

      - name: Restore ladder state
        uses: actions/cache@v4
        with:
          path: .ladder-state
          key: ladder-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ladder-state-

      - name: Restore ladder state artifact
        if: hashFiles('.ladder-state/state.json') == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 restore_ladder_state.py

      - name: Run ladder intraday
        env:
          LADDER_MODE: intraday
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          LIVE_TICKERS: ${{ vars.LIVE_TICKERS }}
          MAX_QTY_MULT: ${{ vars.MAX_QTY_MULT }}
          ORDER_TYPE: ${{ vars.ORDER_TYPE }}
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
          NHPLUG_TOKEN_PATH: .nhplug-token/token.json
          LADDER_STATE_PATH: .ladder-state/state.json
        # ladder_bot places orders only when GITHUB_EVENT_NAME is schedule
        # or workflow_dispatch. GitHub ignores a workflow env override of
        # GITHUB_*, so a kick sets it on the process. That is the scheduled
        # intraday path, including the KST time guards. schedule,
        # workflow_dispatch, and push keep the event name GitHub set.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            GITHUB_EVENT_NAME=schedule python3 ladder_bot.py
          else
            python3 ladder_bot.py
          fi

      - name: Upload ladder state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladder-state
          path: .ladder-state/state.json
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: ignore

name: ladder-intraday

on:
  workflow_dispatch:
  schedule:
    # Weekday polls, every 5 minutes UTC. The two ranges do not overlap.
    # GitHub cron is UTC, so each range covers both US standard time and
    # daylight time. The order guard is 18:00-19:10 ET and 02:00-03:10 ET
    # and skips the runs that land inside it.
    # 09:00-16:59 KST = 00:00-07:59 UTC. Daylight time: the evening guard
    # is 15:00-16:10 KST, so 16:10-16:59 is the KST day session (63).
    # Standard time: 16:00-16:59 is inside 16:00-17:10 KST and exits.
    # Standard time stays on US after-hours (62) until 10:00 KST, then 63.
    # Daylight time is 63 from 09:10, after the 09:00 KST cancel-all.
    - cron: "*/5 0-7 * * 1-5"
    # US session 17:00-08:59 KST = 08:00-23:59 UTC. Daylight time: the
    # morning guard is 07:00-08:10 KST, so 08:10-08:59 is still US
    # after-hours and is polled. Standard time: 08:00-08:59 is inside
    # 08:00-09:10 KST and exits. Friday 15:00-23:59 UTC is Saturday
    # 00:00-08:59 KST, still Friday in New York.
    - cron: "*/5 8-23 * * 1-5"
    # Standard time: Friday after-hours runs until 10:00 KST Saturday
    # (20:00 EST). 09:10-09:55 KST is 00:10-00:55 UTC Saturday. 09:00-09:10
    # is inside the morning guard. Daylight time has already ended at
    # 09:00 KST, so those runs hit the time guard and exit.
    - cron: "*/5 0 * * 6"
  push:
    # Feature-branch pushes must not place orders. main still does.
    branches:
      - main
    paths:
      - .github/workflows/ladder-intraday.yml
      - ladder_bot.py
      - restore_ladder_state.py
  issue_comment:
    types: [created]

concurrency:
  # Only a real kick joins the trading lock. Any other comment still
  # creates this run, and joining ladder-bot would cancel a queued
  # cancel-dup. Push, schedule, and dispatch keep the lock.
  group: >-
    ${{
      (github.event_name != 'issue_comment'
        || startsWith(github.event.comment.body, 'kick'))
      && 'ladder-bot'
      || format('ladder-skip-{0}', github.run_id)
    }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  ladder-intraday:
    name: ladder-intraday
    # schedule, workflow_dispatch, and push run as they do today. A comment
    # runs only for the owner, on a non-PR issue labeled ladder-kick, when
    # the new comment starts with kick. Any other comment skips this job
    # before checkout, so no secret is read and no broker call is made.
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'ladder-kick') &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, 'kick'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore access token
        uses: actions/cache@v4
        with:
          path: .nhplug-token
          key: nhplug-token-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nhplug-token-

      - name: Restore ladder state
        uses: actions/cache@v4
        with:
          path: .ladder-state
          key: ladder-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ladder-state-

      # issue_comment runs cannot write the Actions cache (Cache mode: read).
      # A kick's state is in the artifact. Prefer that file when it is newer
      # than the cache, so the next schedule does not reload the pre-kick book.
      - name: Restore ladder state artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 restore_ladder_state.py

      - name: Run ladder intraday
        env:
          LADDER_MODE: intraday
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          LIVE_TICKERS: ${{ vars.LIVE_TICKERS }}
          MAX_QTY_MULT: ${{ vars.MAX_QTY_MULT }}
          ORDER_TYPE: ${{ vars.ORDER_TYPE }}
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
          NHPLUG_TOKEN_PATH: .nhplug-token/token.json
          LADDER_STATE_PATH: .ladder-state/state.json
        # ladder_bot places orders only when GITHUB_EVENT_NAME is schedule
        # or workflow_dispatch. GitHub ignores a workflow env override of
        # GITHUB_*, so a kick sets it on the process. That is the scheduled
        # intraday path, including the time guards. schedule,
        # workflow_dispatch, and push keep the event name GitHub set.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            GITHUB_EVENT_NAME=schedule python3 ladder_bot.py
          else
            python3 ladder_bot.py
          fi

      - name: Upload ladder state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladder-state
          path: .ladder-state/state.json
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: ignore

name: reset-batch-test

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reset-batch-test.yml
      - test_reset_batch.py
      - ladder_bot.py
      - seed_state.py

permissions:
  contents: read

jobs:
  reset-batch-test:
    name: reset-batch-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Simulate reset batches
        run: python3 test_reset_batch.py

name: seed-state

on:
  workflow_dispatch:
    inputs:
      seed_force:
        description: "지정 티커만 교정. 매도하한:매수상한. 예: KORU:13.5:11.3,SOXL:113:94. 비우면 기존 시드. 주문은 내지 않음."
        required: false
        default: ""
        type: string
      seed_flags:
        description: "주문 없이 표시만 저장. exception_filled=true 또는 false. 더블 매수 가격은 티커.double_used=가격,가격 이며 그 티커 목록을 바꿈. 빈 값이면 그 티커의 double_used를 지움. 세미콜론으로 구분. 예: exception_filled=true;SOXL.double_used=72. 비우면 표시는 그대로."
        required: false
        default: ""
        type: string
  push:
    paths:
      - .github/workflows/seed-state.yml
      - seed_state.py
      - restore_ladder_state.py

concurrency:
  group: ladder-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  seed-state:
    name: seed-state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore ladder state
        uses: actions/cache@v4
        with:
          path: .ladder-state
          key: ladder-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ladder-state-

      - name: Restore ladder state artifact
        if: hashFiles('.ladder-state/state.json') == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 restore_ladder_state.py

      - name: Seed ladder state
        env:
          LADDER_STATE_PATH: .ladder-state/state.json
          SEED_FORCE: ${{ github.event.inputs.seed_force }}
          SEED_FLAGS: ${{ github.event.inputs.seed_flags }}
        run: python3 seed_state.py

      - name: Upload ladder state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladder-state
          path: .ladder-state/state.json
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: ignore

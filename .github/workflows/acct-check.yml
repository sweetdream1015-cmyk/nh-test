name: acct-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acct-check:
    name: acct-check
    # OAuth and /n2/acctinfo only. No orders, no cache, no state file.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: List masked accounts
        env:
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
        run: python3 acct_check.py

name: ladder-reset

on:
  workflow_dispatch:
  schedule:
    # 09:10 KST = 00:10 UTC, and 17:10 KST = 08:10 UTC, weekdays Mon-Fri.
    - cron: "10 0 * * 1-5"
    - cron: "10 8 * * 1-5"
    # Later whole-ticker batches, 2 minutes apart:
    # 09:12, 09:14, 09:16 KST and 17:12, 17:14, 17:16 KST.
    # The 09:10 and 17:10 crons above are unchanged.
    # Scheduled workflows run from the default branch.
    - cron: "12 0 * * 1-5"
    - cron: "14 0 * * 1-5"
    - cron: "16 0 * * 1-5"
    - cron: "12 8 * * 1-5"
    - cron: "14 8 * * 1-5"
    - cron: "16 8 * * 1-5"
    # US standard time: 17:10 KST is 03:10 ET, before premarket at 04:00 ET
    # (18:00 KST). These runs place that reset once premarket is open.
    # 18:00, 18:02, 18:04 KST = 09:00, 09:02, 09:04 UTC.
    # During daylight time the 17:10 reset already finished, so these skip.
    # Deferred tickers are retried by ladder_bot.py in this job, about 2
    # minutes apart, at most 3 extra passes, and not across the time
    # guard. These crons stay as a backstop. The job does not start another
    # workflow run.
    - cron: "0 9 * * 1-5"
    - cron: "2 9 * * 1-5"
    - cron: "4 9 * * 1-5"
    # US standard time: 09:10-09:59 KST is still US after-hours. The day-session
    # reset waits and places 63 from 10:00 KST (01:00 UTC), three batches.
    - cron: "0 1 * * 1-5"
    - cron: "2 1 * * 1-5"
    - cron: "4 1 * * 1-5"
  issue_comment:
    types: [created]
  push:
    # Feature-branch pushes must not place orders. main still does.
    branches:
      - main
    paths:
      - .github/workflows/ladder-reset.yml
      - ladder_bot.py
      - restore_ladder_state.py

concurrency:
  # Schedule, dispatch, and push keep the trading lock. A comment joins
  # it only when the body starts with reset. Any other comment still
  # creates this run, and joining ladder-bot would cancel a queued
  # ladder job. Those runs take a private group instead.
  group: >-
    ${{
      (github.event_name != 'issue_comment'
        || startsWith(github.event.comment.body, 'reset'))
      && 'ladder-bot'
      || format('ladder-skip-{0}', github.run_id)
    }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  ladder-reset:
    name: ladder-reset
    # schedule, workflow_dispatch, and push run as they do today. A comment
    # runs only for the owner, on issue #18 (non-PR, label ladder-kick),
    # when the new comment starts with reset. Any other comment skips this
    # job before checkout, so no secret is read and no broker call is made.
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
      github.event.issue.number == 18 &&
      contains(github.event.issue.labels.*.name, 'ladder-kick') &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, 'reset'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore access token
        uses: actions/cache@v4
        with:
          path: .nhplug-token
          key: nhplug-token-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nhplug-token-

      - name: Restore ladder state
        uses: actions/cache@v4
        with:
          path: .ladder-state
          key: ladder-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ladder-state-

      # issue_comment runs cannot write the Actions cache (Cache mode: read).
      # The reset's state is in the artifact. Prefer that file when it is
      # newer than the cache, so the next run does not reload the pre-reset book.
      - name: Restore ladder state artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 restore_ladder_state.py

      - name: Run ladder reset
        env:
          LADDER_MODE: reset
          RESET_COMMENT: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          LIVE_TICKERS: ${{ vars.LIVE_TICKERS }}
          MAX_QTY_MULT: ${{ vars.MAX_QTY_MULT }}
          ORDER_TYPE: ${{ vars.ORDER_TYPE }}
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
          NHPLUG_TOKEN_PATH: .nhplug-token/token.json
          LADDER_STATE_PATH: .ladder-state/state.json
        # ladder_bot places orders only when GITHUB_EVENT_NAME is schedule
        # or workflow_dispatch. GitHub ignores a workflow env override of
        # GITHUB_*, so a reset comment sets it on the process. That is the
        # scheduled reset path, including the time guards and reset_done.
        # The comment body is only the RESET_COMMENT env value, not shell text.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            GITHUB_EVENT_NAME=schedule python3 ladder_bot.py
          else
            python3 ladder_bot.py
          fi

      - name: Upload ladder state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladder-state
          path: .ladder-state/state.json
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: ignore

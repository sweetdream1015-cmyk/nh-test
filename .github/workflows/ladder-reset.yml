name: ladder-reset

on:
  workflow_dispatch:
  schedule:
    # 09:10 KST = 00:10 UTC, and 17:10 KST = 08:10 UTC, weekdays Mon-Fri.
    - cron: "10 0 * * 1-5"
    - cron: "10 8 * * 1-5"
    # Later whole-ticker batches, 2 minutes apart:
    # 09:12, 09:14, 09:16 KST and 17:12, 17:14, 17:16 KST.
    # The 09:10 and 17:10 crons above are unchanged.
    # Scheduled workflows run from the default branch.
    - cron: "12 0 * * 1-5"
    - cron: "14 0 * * 1-5"
    - cron: "16 0 * * 1-5"
    - cron: "12 8 * * 1-5"
    - cron: "14 8 * * 1-5"
    - cron: "16 8 * * 1-5"
    # US standard time: 17:10 KST is 03:10 ET, before premarket at 04:00 ET
    # (18:00 KST). These runs place that reset once premarket is open.
    # 18:00, 18:02, 18:04 KST = 09:00, 09:02, 09:04 UTC.
    # During daylight time the 17:10 reset already finished, so these skip.
    - cron: "0 9 * * 1-5"
    - cron: "2 9 * * 1-5"
    - cron: "4 9 * * 1-5"
    # US standard time: 09:10-09:59 KST is still US after-hours. The day-session
    # reset waits and places 63 from 10:00 KST (01:00 UTC), three batches.
    - cron: "0 1 * * 1-5"
    - cron: "2 1 * * 1-5"
    - cron: "4 1 * * 1-5"
  push:
    paths:
      - .github/workflows/ladder-reset.yml
      - ladder_bot.py
      - restore_ladder_state.py

concurrency:
  group: ladder-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  ladder-reset:
    name: ladder-reset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore access token
        uses: actions/cache@v4
        with:
          path: .nhplug-token
          key: nhplug-token-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nhplug-token-

      - name: Restore ladder state
        uses: actions/cache@v4
        with:
          path: .ladder-state
          key: ladder-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ladder-state-

      - name: Restore ladder state artifact
        if: hashFiles('.ladder-state/state.json') == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 restore_ladder_state.py

      - name: Run ladder reset
        env:
          LADDER_MODE: reset
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          LIVE_TICKERS: ${{ vars.LIVE_TICKERS }}
          MAX_QTY_MULT: ${{ vars.MAX_QTY_MULT }}
          ORDER_TYPE: ${{ vars.ORDER_TYPE }}
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
          NHPLUG_TOKEN_PATH: .nhplug-token/token.json
          LADDER_STATE_PATH: .ladder-state/state.json
        run: python3 ladder_bot.py

      - name: Upload ladder state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladder-state
          path: .ladder-state/state.json
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: ignore
